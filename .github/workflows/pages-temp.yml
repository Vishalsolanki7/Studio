name: Deploy to GitHub Pages (temp copy assets)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy build to docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a dist/. docs/

          # Copy source assets (images) into docs/assets in case some were not emitted into dist
          mkdir -p docs/assets
          cp -a src/assets/. docs/assets/ || true

      - name: Commit and push docs to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore: publish site to docs/ with assets [skip ci]" || echo "no changes to commit"
          git push origin HEAD:main
